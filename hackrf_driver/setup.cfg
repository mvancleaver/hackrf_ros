[metadata]
name = hackrf_driver
version = 0.1.0
description = Redis-native HackRF driver (pyhackrf2 + pymayhem + redis), no rclpy
python_requires = >=3.10

[options]
packages = find:
install_requires =
    pymayhem
    redis>=7.4.0
    hiredis>=3.3.1
    PyYAML>=5.4
    numpy

[options.packages.find]
where = .
include = hackrf_driver*

[options.extras_require]
hardware =
    pyhackrf2
test =
    pytest

[options.entry_points]
console_scripts =
    hackrf-driver = hackrf_driver.cli:main
